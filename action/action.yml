# Omnisnap composite action (Task 79): run the release binary on this runner,
# capture the pages in every installed engine, write a bundle, upload it.
# Report-only: a capture failure is reported, never raised.
name: Omnisnap
description: Cross-engine layout differences as a self-contained report
author: Omnisnap

inputs:
  version:
    description: Release tag to download (default the current release candidate)
    default: v0.1.0-rc.4
  pages:
    description: One URL per line
    required: true
  engines:
    description: Comma-separated engine ids (default every installed one)
    default: ""
  baseline:
    description: Baseline engine (a Blink browser)
    default: chrome
  runs:
    description: Captures per engine and page
    default: "2"
  out:
    description: Bundle directory
    default: omnisnap-out
  start:
    description: Shell command that starts the app under test
    default: ""
  wait-on:
    description: URL to wait for before capturing
    default: ""
  upload:
    description: Upload the bundle as an artifact
    default: "true"
  artifact-name:
    description: Artifact name (default omnisnap-<os>)
    default: ""
  binary:
    description: Path to an existing omnisnap binary; skips the release download (self-tests, air-gapped setups)
    default: ""
  allow-small-pages:
    description: Do not treat a page under 50 elements as a bot wall (planted and lab pages)
    default: "false"
  setup-timeout:
    description: "Linux: seconds the engine package downloads may take before the step gives up on the engines it could not install and captures with the rest"
    default: "300"

outputs:
  bundle:
    description: Where the bundle was written
    value: ${{ steps.run.outputs.bundle }}

runs:
  using: composite
  steps:
    - name: Download omnisnap
      if: inputs.binary == ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
        esac
        case "$RUNNER_ARCH" in
          X64|AMD64) arch=amd64 ;;
          ARM64)     arch=arm64 ;;
        esac
        ext=""; [ "$os" = windows ] && ext=.exe
        name="omnisnap_${VERSION}_${os}_${arch}${ext}"
        dir="${RUNNER_TEMP}/omnisnap-bin"
        mkdir -p "$dir"
        base="https://github.com/GerMP21/Omnisnap/releases/download/${VERSION}"
        curl -fsSL -o "$dir/$name" "$base/$name"
        curl -fsSL -o "$dir/SHA256SUMS" "$base/SHA256SUMS"
        (cd "$dir" && sha256sum -c --ignore-missing SHA256SUMS)
        chmod +x "$dir/$name"
        echo "$dir" >> "$GITHUB_PATH"
        mv "$dir/$name" "$dir/omnisnap${ext}"
        echo "OMNISNAP_BIN=$dir/omnisnap${ext}" >> "$GITHUB_ENV"

    - name: Use the given binary
      if: inputs.binary != ''
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        [ -f "$BINARY" ] || { echo "::error::binary not found: $BINARY"; exit 1; }
        chmod +x "$BINARY" 2>/dev/null || true
        echo "OMNISNAP_BIN=$BINARY" >> "$GITHUB_ENV"

    # Linux engine setup (tasks/backlog.md, B1). Downloading the packages is
    # the slow part, and the Ubuntu mirror can be slow depending on demand: on
    # 2026-11-20 a consumer's job spent its whole 30 minutes here. So the .debs are cached
    # per runner image (an exact hit installs them with no download at all),
    # Weston and WebKitGTK are only installed when WebKitGTK is wanted, and the
    # downloads run under `setup-timeout`, past which the step warns and the
    # capture goes on with the engines the image ships (Chrome, Firefox).
    # The logic is in linux-engines.sh, where it can be run and tested.
    - name: Plan the Linux engine setup
      id: linux-plan
      if: runner.os == 'Linux'
      shell: bash
      env:
        ENGINES: ${{ inputs.engines }}
      run: '"$GITHUB_ACTION_PATH/linux-engines.sh" plan'

    - name: Restore the Linux engine packages
      id: linux-cache
      if: runner.os == 'Linux'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/omnisnap-apt/*.deb
        key: ${{ steps.linux-plan.outputs.key }}
        restore-keys: ${{ steps.linux-plan.outputs.prefix }}

    - name: "Prepare engines (Linux: fonts; Weston and WebKitGTK when wanted)"
      id: linux-engines
      if: runner.os == 'Linux'
      shell: bash
      env:
        ENGINES: ${{ inputs.engines }}
        OMNISNAP_APT_ARCHIVES: ${{ runner.temp }}/omnisnap-apt
        OMNISNAP_SETUP_BUDGET: ${{ inputs.setup-timeout }}
        OMNISNAP_CACHE_HIT: ${{ steps.linux-cache.outputs.cache-hit }}
      run: '"$GITHUB_ACTION_PATH/linux-engines.sh" install'

    # Only a complete set is saved: a set cut short by the time budget would be
    # restored as an exact hit and leave WebKitGTK half installed.
    - name: Save the Linux engine packages
      if: runner.os == 'Linux' && steps.linux-engines.outputs.complete == 'true' && steps.linux-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/omnisnap-apt/*.deb
        key: ${{ steps.linux-plan.outputs.key }}

    - name: "Prepare engines (macOS: Safari)"
      if: runner.os == 'macOS'
      shell: bash
      run: sudo safaridriver --enable || true

    - name: Start the app
      if: inputs.start != ''
      shell: bash
      run: |
        set -euo pipefail
        nohup bash -c "${{ inputs.start }}" > app.log 2>&1 &
        echo "APP_PID=$!" >> "$GITHUB_ENV"

    - name: Wait for the app
      if: inputs.wait-on != ''
      shell: bash
      run: |
        for i in $(seq 1 120); do
          if curl -fsS -o /dev/null "${{ inputs.wait-on }}"; then exit 0; fi
          sleep 1
        done
        echo "::warning::app did not answer ${{ inputs.wait-on }} in 120 s"
        exit 0

    - name: Write the job
      shell: bash
      env:
        PAGES: ${{ inputs.pages }}
        ENGINES: ${{ inputs.engines }}
        BASELINE: ${{ inputs.baseline }}
        RUNS: ${{ inputs.runs }}
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os
        pages = [{"url": u.strip()} for u in os.environ["PAGES"].splitlines() if u.strip()]
        engines = [e.strip() for e in os.environ["ENGINES"].split(",") if e.strip()]
        job = {"pages": pages, "baseline": os.environ["BASELINE"] or "chrome",
               "runs": int(os.environ["RUNS"] or 2), "output": os.environ["OUT"] or "omnisnap-out"}
        if engines:
            job["engines"] = engines
        json.dump(job, open("omnisnap-job.json", "w"), indent=1)
        PY

    - name: Capture and compare
      id: run
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        ALLOW_SMALL: ${{ inputs.allow-small-pages }}
      # Report-only: a failed capture must not fail the job. `shell: bash` runs
      # the script under `bash -e -o pipefail`, so a non-zero omnisnap exit
      # (3: every capture failed) ended the step before its code was read; -e
      # is off just for that pipeline.
      # Source: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#exit-codes-and-error-action-preference
      run: |
        set -o pipefail
        args=(run omnisnap-job.json --json)
        if [ "$ALLOW_SMALL" = "true" ]; then args+=(--allow-small-pages); fi
        set +e
        "$OMNISNAP_BIN" "${args[@]}" | tee omnisnap-progress.ndjson
        code=${PIPESTATUS[0]}
        set -e
        echo "bundle=$OUT" >> "$GITHUB_OUTPUT"
        if [ "$code" != "0" ]; then
          echo "::warning::omnisnap exited $code: the report may be incomplete"
        fi
        exit 0

    # Report-only covers the upload too: on 2026-11-20 a hosted macOS runner
    # lost DNS for the artifact store mid-upload (ENOTFOUND) after every
    # capture had succeeded, and the failed step failed the job. One retry
    # covers a blip; if both fail, the job warns, and the merge job reports
    # the host as missing instead of the run going red.
    # Source: https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runsstepscontinue-on-error
    - name: Upload the bundle
      id: upload
      if: inputs.upload == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('omnisnap-{0}', runner.os) }}
        path: |
          ${{ inputs.out }}
          omnisnap-progress.ndjson
          app.log
        if-no-files-found: warn

    - name: Upload the bundle (retry)
      id: upload-retry
      if: inputs.upload == 'true' && steps.upload.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('omnisnap-{0}', runner.os) }}
        path: |
          ${{ inputs.out }}
          omnisnap-progress.ndjson
          app.log
        if-no-files-found: warn
        # The first attempt may have finalized before it failed.
        overwrite: true

    - name: Warn when the bundle was not uploaded
      if: inputs.upload == 'true' && steps.upload.outcome == 'failure' && steps.upload-retry.outcome == 'failure'
      shell: bash
      run: echo "::warning::the bundle could not be uploaded after a retry; this host is missing from the merged report"

    - name: Stop the app
      if: always() && inputs.start != ''
      shell: bash
      run: |
        if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" 2>/dev/null || true; fi
