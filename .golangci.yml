# golangci-lint v2 configuration (CONVENTIONS.md, "Commands").
version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - revive
  settings:
    revive:
      rules:
        # Interface implementations keep their parameter names for
        # documentation even when the body does not read them (Classic's
        # AddPreloadScript, the walkers, the fake sessions). Renaming them to
        # "_" would make the code less legible for no correctness gain.
        - name: unused-parameter
          disabled: true
    errcheck:
      # A failed write to the terminal has nowhere to be reported. Structured
      # output (NDJSON progress, bundles) goes through encoders whose errors
      # are checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
