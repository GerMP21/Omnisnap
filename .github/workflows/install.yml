# Task 37 / SPEC-install.md: the weekly network job. It downloads Mozilla's
# real ESR on the CI runners (Linux and Windows; macOS is not in the matrix),
# proves it is discovered, launched and removed.
name: Install (network)

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install ESR (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No macOS: hosted macOS runners are billed at ~10x (see ci.yml).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install, discover, launch, uninstall
        run: go test -tags network ./internal/install/ -run TestInstallESRFromMozilla -v -count=1
