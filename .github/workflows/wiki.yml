name: wiki

# Publish the developer wiki: mirror docs/internals/ into the repository's
# GitHub Wiki on every push to main that changes it, or by hand (Actions →
# wiki → Run workflow). The pages link to the code on main, so the wiki
# follows main, not dev.

on:
  push:
    branches:
      - main
    paths:
      - "docs/internals/**"
      - "scripts/publish-wiki.sh"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

# A newer publish replaces an older one: the newest main wins.
concurrency:
  group: wiki
  cancel-in-progress: true

permissions:
  # Pushing to the wiki's repository needs write access to the contents.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Clone the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! git clone --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Can't clone the wiki. GitHub creates its repository only after the first page exists: open the repository's Wiki tab, create any page once, then run this workflow again."
            exit 1
          fi

      - name: Mirror docs/internals into the wiki
        run: scripts/publish-wiki.sh wiki "${GITHUB_SHA::7}"

      - name: Push
        run: |
          if [ "$(git -C wiki rev-list --count '@{upstream}..HEAD')" -gt 0 ]; then
            git -C wiki push --quiet origin HEAD
            echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki"
          else
            echo "Nothing to publish."
          fi
