# Publish the JSON Schemas at https://omnisnap.org/schema/... — the URLs in
# their $ids (internal/schema/schema.go).
#
# One-time setup:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. DNS for omnisnap.org (apex), per
#      https://docs.github.com/en/pages/configuring-a-custom-domain-for-your-github-pages-site/managing-a-custom-domain-for-your-github-pages-site
#        A     185.199.108.153, 185.199.109.153, 185.199.110.153, 185.199.111.153
#        AAAA  2606:50c0:8000::153, 2606:50c0:8001::153, 2606:50c0:8002::153, 2606:50c0:8003::153
#   3. Settings → Pages → Custom domain: omnisnap.org, then "Enforce HTTPS".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site from the schemas' $ids
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, sys

          site = pathlib.Path("_site")
          for path in sorted(glob.glob("schema/*.schema.json")):
              doc = json.loads(pathlib.Path(path).read_text())
              try:
                  rel = doc["$id"].split("omnisnap.org/", 1)[1]
              except (KeyError, IndexError):
                  sys.exit(f"{path}: $id is not on omnisnap.org")
              target = site / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(pathlib.Path(path).read_text())

          entries = sorted(p.relative_to(site) for p in site.rglob("*.json"))
          if not entries:
              sys.exit("no schema was published")
          items = "\n".join(f'<li><a href="/{e}">{e}</a></li>' for e in entries)
          (site / "index.html").write_text(
              "<!doctype html><meta charset=utf-8><title>Omnisnap schemas</title>"
              "<h1>Omnisnap JSON Schemas</h1><ul>\n" + items + "\n</ul>\n"
          )
          (site / "CNAME").write_text("omnisnap.org\n")
          (site / ".nojekyll").write_text("")
          print(f"built {len(entries)} schema(s)")
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
