# Action self-test (Tasks 79/81): build the binary from this checkout, run the
# composite action on the planted suite on both runners, merge the bundles and
# assert the planted finding reaches the comment. Both runners run the same job
# (merge requires the same pages: SPEC-merge.md "Input"), and Windows injects
# the failure by not serving the pages: every capture there fails, and the job
# must still conclude success (report-only, SPEC-ci-action.md).
name: Action self-test

on:
  workflow_dispatch:
  release:
    # published covers a stable release, prereleased and created cover a
    # candidate: `gh release create --prerelease` does not always reach the
    # runner as `prereleased` (2026-11-19: the v0.1.0-rc.1 release fired no
    # run at all, so the self-test was dispatched by hand).
    types: [published, prereleased, created]

permissions:
  contents: read

jobs:
  planted:
    name: planted (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is back (2026-11-19): the account has the runners, and the
        # Action's own self-test should cover Safari the way a consumer's
        # run does. Windows stays the fault-injection runner.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build the binary under test
        run: go build -o bin/ ./cmd/omnisnap
      - name: Serve the planted pages (not on Windows, the fault-injection runner)
        if: runner.os != 'Windows'
        run: |
          go build -o bin/lab ./cmd/omnisnap-lab
          (bin/lab serve --dir testdata/planted --addr 127.0.0.1:8099 > serve.log 2>&1 &)
          sleep 2
      - name: Pick the pages
        id: pages
        # The same list on both runners: a bundle from a different job cannot
        # be merged. On Windows nothing listens on 8099, so every capture fails.
        run: |
          set -euo pipefail
          {
            echo "url<<EOF"
            echo "http://127.0.0.1:8099/01-card-width"
            echo "http://127.0.0.1:8099/03-overflow"
            echo "http://127.0.0.1:8099/07-font"
            echo "http://127.0.0.1:8099/19-list-rhythm"
            echo "http://127.0.0.1:8099/30-control-cards"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: ./action
        with:
          # The self-test builds the binary, so it does not need the release:
          # the action accepts a binary it did not download (the `binary`
          # input).
          binary: ${{ runner.os == 'Windows' && 'bin/omnisnap.exe' || 'bin/omnisnap' }}
          allow-small-pages: "true"
          pages: ${{ steps.pages.outputs.url }}
          out: omnisnap-out
          artifact-name: omnisnap-${{ matrix.os }}
      - name: The action concluded success (report-only)
        run: echo "the capture step never fails the job"
      - name: Bundle or warning
        run: test -f omnisnap-out/summary.json && echo "bundle written" || echo "::warning::no summary was written"
      - name: Five pages within ten minutes (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - STARTED ))
          echo "planted job: ${elapsed}s for five pages"
          [ "$elapsed" -lt 600 ]

  merge:
    name: merge and assert
    needs: planted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the binary
        run: go build -o bin/ ./cmd/omnisnap
      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          pattern: omnisnap-*
          path: bundles
      - name: Merge
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find bundles -maxdepth 2 -name summary.json -printf '%h\n')
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::warning::no bundle was produced"
            exit 0
          fi
          bin/omnisnap merge "${dirs[@]}" --rename-hosts -o merged
      - name: Render the comment
        if: hashFiles('merged/summary.json') != ''
        run: |
          set -euo pipefail
          bin/omnisnap comment --report-url "https://example.invalid/report" \
            --run-url "https://example.invalid/run" merged > merged/comment.md
          grep -q 'omnisnap-report' merged/comment.md
      - name: The planted finding reaches the comment
        if: hashFiles('merged/summary.json') != ''
        run: grep -q 'table#target' merged/comment.md
      # SPEC-ci-action success criterion 2: with one OS job failing, "the
      # comment says which part failed". The Notes list it as host/page: failed.
      - name: The comment names the fault-injected part
        if: hashFiles('merged/summary.json') != ''
        run: |
          grep -qE '^- [^ ]+/[^ ]+: failed$' merged/comment.md
      - name: Upload the merged report
        uses: actions/upload-artifact@v7
        with:
          name: omnisnap-merged
          path: merged
          if-no-files-found: warn
