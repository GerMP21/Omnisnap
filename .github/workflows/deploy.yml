# Deploy the schema site to Cloudflare Workers (static assets).
#
# One-time setup:
#   1. omnisnap.org must be an active zone on the Cloudflare account, and the
#      hostnames must be free of DNS records: a custom domain cannot be created
#      over an existing CNAME.
#   2. Repository secrets:
#        CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit,
#                               Workers Routes:Edit (zone) and DNS:Edit (zone,
#                               so the custom domains can be created)
#        CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard
#   3. The custom domains come from wrangler.json (routes with
#      custom_domain: true); Cloudflare issues the certificates.
name: Deploy schemas

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "src/**"
      - "tools/site/**"
      - "wrangler.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-schemas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # A push to main must not be red just because the operator has not set
      # the Cloudflare credentials yet: warn and skip until they exist.
      - name: Check deployment credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the schema deploy (see schema/README.md)"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.configured == 'true'
      - name: Build the site from the schemas' $ids
        if: steps.creds.outputs.configured == 'true'
        run: python3 tools/site/build.py
      - uses: cloudflare/wrangler-action@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
