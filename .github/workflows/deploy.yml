# Deploy the schema site to Cloudflare Workers (static assets).
#
# One-time setup:
#   1. omnisnap.org must be an active zone on the Cloudflare account, and the
#      hostnames must be free of DNS records: a custom domain cannot be created
#      over an existing CNAME.
#   2. Repository secrets:
#        CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit,
#                               Workers Routes:Edit (zone) and DNS:Edit (zone,
#                               so the custom domains can be created)
#        CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard
#   3. The custom domains come from wrangler.json (routes with
#      custom_domain: true); Cloudflare issues the certificates.
name: Deploy schemas

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "src/**"
      - "tools/site/**"
      - "wrangler.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-schemas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the site from the schemas' $ids
        run: python3 tools/site/build.py
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
