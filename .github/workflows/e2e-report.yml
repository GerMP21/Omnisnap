# Reusable-workflow self-test: call report.yml the way a consumer does, so its
# own wiring is tested, not just the composite action. e2e-action.yml runs
# `uses: ./action` from this checkout and never goes through report.yml, which
# is how v0.1.0-rc.2 shipped with two consumer-breaking bugs (2026-11-20): the
# capture jobs pointed `uses:` at the checkout root instead of its action/
# folder, and the merge job saved the binary under a name SHA256SUMS does not
# list, so the checksum step verified nothing and failed.
#
# Like a consumer, it uses a release binary, so it needs a published release
# (the `pick` job below says which). report.yml has no allow-small-pages input, so the
# 50-element bot-wall rule applies: 03-overflow (82 elements) is captured and
# its planted finding `table#target` must reach the comment; 01-card-width
# (47 elements) is rejected on every host, which keeps the comment's "Not
# checked" path covered too. e2e-action.yml still runs the full planted assertions.
name: Report workflow self-test

on:
  workflow_dispatch:
  release:
    # The same events as e2e-action.yml: a candidate does not always arrive
    # as `prereleased`.
    types: [published, prereleased, created]
  pull_request:
    paths:
      - .github/workflows/report.yml
      - .github/workflows/e2e-report.yml
      - action/**

permissions:
  contents: read
  pull-requests: write # report.yml comments on same-repository pull requests

jobs:
  # The binary must be a published release. On a release event that is the
  # release itself. On a pull request it cannot be report.yml's `version`
  # default: the PR that bumps the default to the next tag runs before that
  # tag exists, and the download 404s (2026-11-20, the rc.5 bump). So it is
  # the newest release whose assets are up, which tests this PR's workflow
  # and action with a binary that exists.
  pick:
    name: pick the release binary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = release ]; then
            version=$RELEASE_TAG
          else
            version=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
              --jq '[.[] | select(any(.assets[]; .name == "SHA256SUMS"))][0].tag_name')
          fi
          [ -n "$version" ] && [ "$version" != null ] || { echo "::error::no published release to test with"; exit 1; }
          echo "testing with the $version binary"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  report:
    needs: pick
    uses: ./.github/workflows/report.yml
    with:
      version: ${{ needs.pick.outputs.version }}
      # Python is on every hosted image, and the command runs under bash on
      # all three (Git Bash on Windows).
      start: python -m http.server 8099 --bind 127.0.0.1 --directory testdata/planted
      wait-on: http://127.0.0.1:8099/01-card-width.html
      pages: |
        http://127.0.0.1:8099/01-card-width.html
        http://127.0.0.1:8099/03-overflow.html
      runs: "1"

  assert:
    name: assert the merged report
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the merged report
        uses: actions/download-artifact@v8
        with:
          name: omnisnap-merged
          path: merged
      - name: Every OS job reached the merge, and the comment carries the finding
        shell: bash
        run: |
          set -euo pipefail
          test -f merged/summary.json
          grep -q 'omnisnap-report' merged/comment.md
          grep -q 'table#target' merged/comment.md
          hosts=$(python3 -c 'import json; print(len(json.load(open("merged/summary.json"))["hosts"]))')
          echo "hosts in the merged report: $hosts"
          [ "$hosts" -eq 3 ]
