# Cut a release: build the five binaries, checksum them and publish the
# GitHub release. The tag is the whole interface — the Action downloads the
# binary from `releases/download/<tag>/`, and the assets are named
# `omnisnap_<tag>_<os>_<arch>`, so the tag and the version string the release
# tool is given must be the same string (SPEC-ci-action.md, "The merge job").
#
# The usual way in: push a tag and let this workflow do the rest.
#   git tag -a v0.2.0-rc.2 -m "Omnisnap v0.2.0-rc.2"
#   git push origin v0.2.0-rc.2
# A tag with a dash in it is published as a prerelease. The release notes are
# GitHub's generated ones, with `docs/release-notes/<tag>.md` ahead of them
# when that file exists in the tagged commit; a re-run of the tag keeps the
# notes the release already has.
#
# The jobs (SPEC-ci-action.md, change run-self-tests-on-release):
#
#   release ----+--> deploy        omnisnap.org for the tag (deploy.yml)
#               +--> e2e-report    report.yml as a consumer calls it, with
#               |                  the release's binary (e2e-report.yml)
#   e2e-action  -----------------  the composite action on the planted suite,
#               |                  built from the tag (e2e-action.yml)
#               v
#   packages    needs release, e2e-action and e2e-report
#
# The deploy and both self-tests are called from here because a `release`
# listener never fires for a release this workflow's token creates. A failed
# self-test makes the run red and keeps the tag off npm and PyPI; the tag and
# the GitHub release stay as published (cut the next candidate instead).
# A manual re-run tests the workflow files of the ref it starts from, so start
# it from the tag itself ("Use workflow from"), not from main.
#
# - `packages` publishes the same binaries to npm and PyPI with trusted
#   publishing (OIDC): no registry token is stored. One-time setup: each npm
#   package (omnisnap and the five @omnisnap/* platform packages) and the PyPI
#   project `omnisnap` name this repository and this workflow file
#   (release.yml) as a trusted publisher.
#   Sources: https://docs.npmjs.com/trusted-publishers/
#            https://docs.pypi.org/trusted-publishers/adding-a-publisher/
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to publish (it must already exist on the remote)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag itself, also when started by hand from a branch: the
          # binaries and the packages are built from what was tagged.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: A manual run tests the workflows of the ref it starts from
        # The called workflows (e2e-report.yml, report.yml, deploy.yml) are
        # read from the run's own ref, not from the tag input.
        if: github.event_name == 'workflow_dispatch' && github.ref_name != env.TAG
        env:
          REF: ${{ github.ref_name }} # through env, never pasted into the script
        run: echo "::warning::the workflows under test are from $REF, not $TAG; start the run from the tag to test the tag's report.yml"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The unit tests pass
        run: go test ./... -count=1
      - name: Build the five targets
        # The same tool the owner runs locally: five binaries, SHA256SUMS and
        # a check that the host binary reports the stamped version. --stage
        # also copies them into the npm and PyPI packages, and first refuses
        # a tag the package files were not bumped for.
        run: go run ./tools/release --version "$TAG" --stage
      - name: Keep the staged binaries for the packages job
        uses: actions/upload-artifact@v7
        with:
          name: staged-binaries
          path: |
            packages/npm/platforms/*/bin
            packages/pypi/omnisnap/bin
          if-no-files-found: error
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag with a dash in it is a prerelease (v0.1.0-rc.1).
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # A hand-written notes file for the tag goes ahead of GitHub's
          # generated notes (gh prepends --notes to --generate-notes).
          notes=()
          if [ -f "docs/release-notes/$TAG.md" ]; then
            notes=(--notes "$(cat "docs/release-notes/$TAG.md")")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release exists: replace the assets (a re-run of the tag).
            # The notes stay as they are, edits made on GitHub included.
            gh release upload "$TAG" dist/* --clobber
            echo "release $TAG updated"
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes "${notes[@]}" $prerelease \
              --title "$TAG"
            echo "release $TAG published"
          fi
      - name: The assets are downloadable
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p /tmp/rel && cd /tmp/rel
          curl -fsSL -O "$base/SHA256SUMS"
          curl -fsSL -O "$base/omnisnap_${TAG}_linux_amd64"
          sha256sum -c --ignore-missing SHA256SUMS

  deploy:
    name: deploy omnisnap.org
    needs: release
    # The deploy calls report.yml, which declares pull-requests: write; a
    # called workflow cannot be granted less than it declares.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  # The composite-action self-test builds its own binary from the tag, so it
  # starts with the release instead of after it.
  e2e-action:
    name: self-test (composite action)
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-action.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  # The reusable-workflow self-test downloads the release's binary, so it
  # waits for the assets. It calls report.yml, which declares
  # pull-requests: write (no comment is posted outside a pull request).
  e2e-report:
    name: self-test (reusable workflow)
    needs: release
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/e2e-report.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  packages:
    name: publish to npm and PyPI
    # Only once the tag passed both self-tests: a consumer-breaking tag stays
    # off the registries (the GitHub release and the website do not wait).
    needs: [release, e2e-action, e2e-report]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # trusted publishing: npm and PyPI accept this run's OIDC token
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Get the release's binaries
        uses: actions/download-artifact@v8
        with:
          name: staged-binaries
          path: packages
      - name: Make them executable
        # Artifacts do not keep file modes.
        run: chmod 755 packages/npm/platforms/*/bin/* packages/pypi/omnisnap/bin/*/*
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # No registry-url: it writes an .npmrc with a placeholder token
          # (NODE_AUTH_TOKEN=XXXXX-…), and when npm's trusted-publishing
          # exchange is refused, npm falls back to that token and the
          # registry answers a misleading 404. Without it a refusal fails
          # as "needs authentication", with npm's reason in the log below.
          package-manager-cache: false
      - name: npm 11.5.1 or later
        # Trusted publishing needs npm 11.5.1+ on Node 22.14+.
        run: npm install -g npm@11
      - name: Publish to npm
        run: |
          set -euo pipefail
          # The platform packages first: the main package pins them as
          # optionalDependencies. A version already on npm is skipped, so a
          # re-run publishes only what is missing. A stable version is
          # `latest`. A candidate is `latest` only while the package's
          # `latest` is not a stable version (a new package, or only
          # candidates so far); after a stable it goes to `next`, so
          # `npm i omnisnap` keeps installing the stable
          # (specs/CONVENTIONS.md, "Versioning"). Decided by `latest`, not by
          # the version list: `omnisnap@0.0.0`, the deprecated 2026-11-19
          # name reservation, is dash-free but was never a release.
          for dir in packages/npm/platforms/* packages/npm/omnisnap; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            tag=latest
            case "$version" in *-*)
              # Only a package npm does not know (E404) has no latest; any
              # other failure stops the job rather than guess `latest`.
              if ! current=$(npm view "$name" dist-tags.latest 2>"$RUNNER_TEMP/npm-view.err"); then
                grep -q E404 "$RUNNER_TEMP/npm-view.err" || { cat "$RUNNER_TEMP/npm-view.err" >&2; exit 1; }
                current=
              fi
              case "$current" in ''|*-*) ;; *) tag=next ;; esac ;;
            esac
            echo "$name@$version -> $tag"
            # --loglevel verbose: npm logs the registry's answer to its OIDC
            # exchange (for example no matching trusted publisher) only there.
            (cd "$dir" && npm publish --access public --tag "$tag" --loglevel verbose)
          done
      - name: Build the wheels
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m pip install --quiet build wheel twine
          "$py" tools/release/wheels.py --out dist-py
          "$py" -m twine check dist-py/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py/
          # A re-run uploads only the wheels that are missing.
          skip-existing: true
