# Fork pull requests get a read-only token: the comment is posted by this
# follow-up workflow, which never checks out or runs fork code (Task 80).
name: Omnisnap comment (fork-safe)

on:
  workflow_run:
    workflows: ["Omnisnap report"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download the merged report
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: omnisnap-merged
          path: merged
        continue-on-error: true
      - name: Render and upsert
        if: hashFiles('merged/summary.json') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            // The comment is rendered by the merge job and uploaded with the
            // report when present; otherwise a short note points at the run.
            const marker = '<!-- omnisnap-report -->';
            let body;
            try { body = fs.readFileSync('merged/comment.md', 'utf8'); }
            catch { body = marker + '\n### Omnisnap\n\nThe report is ready: ' +
              context.payload.workflow_run.html_url; }
            const {owner, repo} = context.repo;
            const prs = await github.rest.pulls.list({owner, repo, state: 'open', per_page: 100});
            const branch = context.payload.workflow_run.head_branch;
            const pr = prs.data.find((p) => p.head.ref === branch);
            if (!pr) { core.warning('no open pull request for ' + branch); return; }
            const list = await github.rest.issues.listComments({owner, repo, issue_number: pr.number, per_page: 100});
            const existing = list.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
            }
