name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No macOS for now: hosted macOS runners are billed at ~10x and the
        # account cannot get them. Safari is a manual workflow
        # (safari-smoke.yml); to bring macOS back add macos-latest here and in
        # conformance, and set `macos: every` for the Action if wanted.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        # A directory output lets Go add .exe on Windows.
        run: go build -o bin/ ./cmd/omnisnap
      - name: Smoke test
        run: bin/omnisnap version
      - name: Unit tests
        run: go test ./...
      - name: Planted fixtures match the spike
        # The export reads the spike's pages.mjs: no npm install needed.
        if: runner.os == 'Linux'
        run: node spikes/layout-diff/tools/export-planted.mjs --check
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  conformance:
    # Task 22-24: one driver suite against every engine family the runner has:
    # Chrome/Edge/Firefox on Windows, WebKitGTK on Linux. Safari needs a macOS
    # runner (manual: safari-smoke.yml).
    name: driver conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Linux engines (WebKitGTK, Weston, font parity)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y weston fonts-liberation fonts-noto-mono
          # 26.04 renamed the driver package; older images still use the first.
          # The driver package does not pull MiniBrowser 6.0, which discovery
          # and the conformance lane need.
          sudo apt-get install -y webkitgtk-webdriver libwebkitgtk-6.0-4 || \
            sudo apt-get install -y webkit2gtk-driver libwebkitgtk-6.0-4 || true
      - name: Conformance
        # Ubuntu 24.04+ restricts unprivileged user namespaces (AppArmor), which
        # crashes Chrome's sandbox before DevTools opens; CI is the only place
        # that opts out. WebKitGTK's conformance stays gated: see
        # specs/SPEC-capture-webkit-viewport.md.
        env:
          OMNISNAP_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test -tags browsers ./internal/drivers/... -run Conformance -count=1 -v
      - name: Viewer in a real browser
        if: runner.os == 'Linux'
        env:
          OMNISNAP_NO_SANDBOX: "1"
        run: go test -tags browsers ./internal/viewer/ -run 'Render' -count=1 -v
      # Task 31: TerminateProcess on the browser must take its child processes
      # with it (Job Objects); only Windows can exercise it.
      - name: Process cleanup (Job Objects)
        if: runner.os == 'Windows'
        run: go test -tags browsers ./internal/process/... -count=1
      # Task 68: Edge is preinstalled on the Windows image
      # (actions/runner-images), and its tracking prevention is off under
      # --headless, so the test opens a window. The log is the investigation's
      # artifact: it records how many requests Edge blocked.
      - name: Branded blocking (Edge)
        if: runner.os == 'Windows'
        run: go test -tags browsers ./internal/branded/... -count=1 -v 2>&1 | tee branded.log
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: branded-blocked
          path: branded.log
          if-no-files-found: ignore
