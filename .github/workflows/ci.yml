name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is back (2026-11-19): the account has the runners now, so
        # the unit tests and the lint run on the third OS too, and the
        # conformance job covers Safari.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        # A directory output lets Go add .exe on Windows.
        run: go build -o bin/ ./cmd/omnisnap
      - name: Smoke test
        run: bin/omnisnap version
      - name: Unit tests
        run: go test ./...
      - name: Planted fixtures match the spike
        # The export reads the spike's pages.mjs: no npm install needed.
        if: runner.os == 'Linux'
        run: node spikes/layout-diff/tools/export-planted.mjs --check
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  planted-gates:
    # Task 59: the ground-truth gates on every pull request: recall on the
    # planted bugs, no Report on the controls, the knowledge-base pages
    # explained, the budgets respected. TestPlantedGates reads the golden
    # captures, but `-run Planted` also runs the planted audit and appearance
    # pages through real engines (SPEC-ground-truth.md "Gates (CI, e2e)":
    # on the runner's Chrome and Firefox), so this job needs the browsers.
    # CONVENTIONS asks for these on every PR touching capture, layout-diff or
    # triage; they run on all of them.
    name: planted gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The ground-truth gates
        # Chrome's sandbox crashes before DevTools opens on Ubuntu 24.04+
        # (AppArmor restricts unprivileged user namespaces): the same opt-out
        # as the conformance job (internal/process/blink.go).
        env:
          OMNISNAP_NO_SANDBOX: "1"
        run: go test -tags e2e ./test/e2e/... -run Planted -count=1 -v

  conformance:
    # Task 22-24: one driver suite against every engine family the runner has:
    # Chrome/Edge/Firefox on Windows, WebKitGTK on Linux, Safari on macOS.
    name: driver conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The ~100 packages below (72 MB) come from the runner's Ubuntu mirror,
      # whose speed varies run to run: one run spent 15 of its 17 minutes
      # downloading (495 s on libwebkitgtk-6.0-4 alone), another took 35 s.
      # The .debs are cached, so apt installs from disk and downloads only
      # what changed since the runner image the cache was saved on.
      # Source: https://github.com/actions/cache/blob/v6/README.md
      # The key follows the runner image (its package set): ImageOS and
      # ImageVersion are the runner's own variables, which the `env` context
      # does not see, so a step reads them from the shell.
      # Source: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#env-context
      - name: Key the Linux engine package cache
        if: runner.os == 'Linux'
        id: apt-key
        run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache the Linux engine packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-engines-${{ runner.os }}-${{ steps.apt-key.outputs.image }}-v1
          restore-keys: |
            apt-engines-${{ runner.os }}-
      - name: Linux engines (WebKitGTK, Weston, font parity)
        if: runner.os == 'Linux'
        run: |
          # apt keeps its downloads in the cached directory; partial/ is apt's
          # private download area and stays out of the cache.
          archives="$RUNNER_TEMP/apt-archives"
          sudo mkdir -p "$archives/partial"
          sudo chown -R _apt:root "$archives/partial"
          apt=(sudo apt-get -o "Dir::Cache::Archives=$archives" -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get update
          "${apt[@]}" install -y weston fonts-liberation fonts-noto-mono
          # 26.04 renamed the driver package; older images still use the first.
          # The driver package does not pull MiniBrowser 6.0, which discovery
          # and the conformance lane need.
          "${apt[@]}" install -y webkitgtk-webdriver libwebkitgtk-6.0-4 || \
            "${apt[@]}" install -y webkit2gtk-driver libwebkitgtk-6.0-4 || true
          # The cache action saves as the runner user: the .debs must be readable.
          sudo chmod a+r "$archives"/*.deb
      - name: Enable Safari (macOS)
        # Safari's driver needs a one-time enable, which asks for an admin
        # password: on a hosted runner `sudo` is passwordless (Task 2).
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      # Tasks 30 and 32: discovery on the real runner finds the browsers the
      # image ships, each with a version, and stays within its time budget.
      # The lists come from the images' "Browsers and Drivers" sections
      # (github.com/actions/runner-images, images/*/*-Readme.md, 2026-11-19).
      # Chromium is only on Ubuntu 24.04 and `ubuntu-latest` moves to 26.04
      # this month, so the Linux list leaves it out.
      - name: Discovery on the runner
        env:
          # `a && b || c` is the documented ternary form:
          # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#operators
          OMNISNAP_EXPECT_BROWSERS: ${{ runner.os == 'macOS' && 'chrome,edge,firefox,safari' || 'chrome,edge,firefox' }}
        run: go test -tags browsers ./internal/discovery/... -count=1 -v
      - name: Conformance
        # Ubuntu 24.04+ restricts unprivileged user namespaces (AppArmor), which
        # crashes Chrome's sandbox before DevTools opens; CI is the only place
        # that opts out. WebKitGTK runs here: the harness takes it whenever
        # weston is installed (the step above), under a private headless
        # display (specs/SPEC-process.md, WebKitGTK row).
        # The harness finds browsers on PATH and through discovery (Windows
        # keeps them in the registry, macOS in app bundles), and
        # OMNISNAP_EXPECT_ENGINES fails the run when one of the image's
        # engines did not start: before, Windows skipped the whole suite and
        # macOS never ran Blink, both green (run 44658320035).
        env:
          OMNISNAP_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
          OMNISNAP_EXPECT_ENGINES: ${{ runner.os == 'Linux' && 'blink,gecko,webkit' || runner.os == 'macOS' && 'blink,gecko,safari' || 'blink,gecko' }}
        run: go test -tags browsers ./internal/drivers/... -run Conformance -count=1 -v
      - name: Viewer in a real browser
        if: runner.os == 'Linux'
        env:
          OMNISNAP_NO_SANDBOX: "1"
        run: go test -tags browsers ./internal/viewer/ -run 'Render' -count=1 -v
      # Task 31: TerminateProcess on the browser must take its child processes
      # with it (Job Objects); only Windows can exercise it.
      - name: Process cleanup (Job Objects)
        if: runner.os == 'Windows'
        run: go test -tags browsers ./internal/process/... -count=1
      # Task 68: Edge is preinstalled on the Windows image
      # (actions/runner-images), and its tracking prevention is off under
      # --headless, so the test opens a window. The log is the investigation's
      # artifact: it records how many requests Edge blocked.
      - name: Branded blocking (Edge)
        if: runner.os == 'Windows'
        run: go test -tags browsers ./internal/branded/... -count=1 -v 2>&1 | tee branded.log
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows'
        with:
          name: branded-blocked
          path: branded.log
          if-no-files-found: ignore

  # Tasks 83/84: the wrappers in a fresh project. The platform packages are not
  # published yet, so the binary comes from OMNISNAP_BINARY (the built one).
  packages:
    name: packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the binary the wrappers run
        run: go build -o bin/ ./cmd/omnisnap
      - name: npm wrapper
        run: |
          set -euo pipefail
          cd packages/npm/omnisnap
          npm test
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/omnisnap-*.tgz)
          size=$(wc -c < "$tarball")
          echo "tarball: $tarball ($size bytes)"
          [ "$size" -lt 15000000 ]
      - name: npm fresh project
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/omnisnap-*.tgz)
          mkdir -p "$RUNNER_TEMP/fresh-npm"
          cd "$RUNNER_TEMP/fresh-npm"
          npm init -y >/dev/null
          npm install --no-save --omit=optional "$tarball"
          bin="$GITHUB_WORKSPACE/bin/omnisnap"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          OMNISNAP_BINARY="$bin" ./node_modules/.bin/omnisnap version
      - name: Python wrapper
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -m pip install --quiet --disable-pip-version-check build pytest
          cd packages/pypi
          "$py" -m pytest -q
          "$py" -m build --wheel --outdir "$RUNNER_TEMP/dist"
          wheel=$(ls "$RUNNER_TEMP"/dist/*.whl)
          size=$(wc -c < "$wheel")
          echo "wheel: $wheel ($size bytes)"
          [ "$size" -lt 15000000 ]
          "$py" -m pip install --quiet --disable-pip-version-check "$wheel"
          exe="$RUNNER_TEMP/venv/bin/omnisnap"
          [ -x "$exe" ] || exe="$RUNNER_TEMP/venv/Scripts/omnisnap.exe"
          bin="$GITHUB_WORKSPACE/bin/omnisnap"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          OMNISNAP_BINARY="$bin" "$exe" version
