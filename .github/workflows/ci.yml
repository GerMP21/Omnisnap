name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        # A directory output lets Go add .exe on Windows.
        run: go build -o bin/ ./cmd/omnisnap
      - name: Smoke test
        run: bin/omnisnap version
      - name: Unit tests
        run: go test ./...
      - name: Planted fixtures match the spike
        # The export reads the spike's pages.mjs: no npm install needed.
        if: runner.os == 'Linux'
        run: node spikes/layout-diff/tools/export-planted.mjs --check
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  conformance:
    # Task 22-24: one driver suite against every engine family the runner has.
    # A real Safari on macOS, WebKitGTK on Linux, Chrome/Edge/Firefox on all.
    name: driver conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Linux engines (WebKitGTK, Weston, font parity)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y weston fonts-liberation fonts-noto-mono
          sudo apt-get install -y webkit2gtk-driver || sudo apt-get install -y webkitgtk-6.0-driver || true
      - name: macOS Safari
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      - name: Conformance
        run: go test -tags browsers ./internal/drivers/... -run Conformance -count=1 -v
      - name: Viewer in a real browser
        if: runner.os == 'Linux'
        run: go test -tags browsers ./internal/viewer/ -run 'Render' -count=1 -v
