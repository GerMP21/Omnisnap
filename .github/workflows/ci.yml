name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # macOS runners are opt-in: set the repository variable OMNISNAP_MACOS=1
    # when the account can get them. Otherwise the job is skipped here instead
    # of queueing forever (Tasks 2/23 wait on that variable).
    if: matrix.os != 'macos-latest' || vars.OMNISNAP_MACOS == '1'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        # A directory output lets Go add .exe on Windows.
        run: go build -o bin/ ./cmd/omnisnap
      - name: Smoke test
        run: bin/omnisnap version
      - name: Unit tests
        run: go test ./...
      - name: Planted fixtures match the spike
        # The export reads the spike's pages.mjs: no npm install needed.
        if: runner.os == 'Linux'
        run: node spikes/layout-diff/tools/export-planted.mjs --check
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  conformance:
    # Task 22-24: one driver suite against every engine family the runner has.
    # A real Safari on macOS, WebKitGTK on Linux, Chrome/Edge/Firefox on all.
    name: driver conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    if: matrix.os != 'macos-latest' || vars.OMNISNAP_MACOS == '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Linux engines (WebKitGTK, Weston, font parity)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y weston fonts-liberation fonts-noto-mono
          # 26.04 renamed the driver package; older images still use the first.
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver || true
      - name: macOS Safari
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      - name: Conformance
        # Ubuntu 24.04+ restricts unprivileged user namespaces (AppArmor), which
        # crashes Chrome's sandbox before DevTools opens; CI is the only place
        # that opts out. WebKitGTK's conformance stays gated: see
        # specs/SPEC-capture-webkit-viewport.md.
        env:
          OMNISNAP_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test -tags browsers ./internal/drivers/... -run Conformance -count=1 -v
      - name: Viewer in a real browser
        if: runner.os == 'Linux'
        env:
          OMNISNAP_NO_SANDBOX: "1"
        run: go test -tags browsers ./internal/viewer/ -run 'Render' -count=1 -v
