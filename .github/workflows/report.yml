# Reusable workflow (Tasks 79/80): three OS jobs, one merge job, one PR comment.
# Report-only: every job concludes success whatever the captures did.
name: Omnisnap report

on:
  workflow_call:
    inputs:
      start:
        type: string
        default: ""
      wait-on:
        type: string
        default: ""
      pages:
        type: string
        required: true
      engines:
        type: string
        default: ""
      baseline:
        type: string
        default: chrome
      runs:
        type: string
        default: "2"
      version:
        type: string
        default: v0.1.0-rc.5
      macos:
        description: every (default), labelled, or never
        type: string
        default: every
      artifact-retention-days:
        type: string
        default: "7"
      setup-timeout:
        description: "Linux: seconds the engine package downloads may take"
        type: string
        default: "300"

permissions:
  contents: read
  pull-requests: write

jobs:
  capture:
    name: capture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The macOS job carries Safari, so it is on by default (2026-11-19:
        # the account has the runners). `labelled` runs Safari only on PRs
        # labelled omnisnap:safari, `never` drops the job.
        #
        # The choice is made here, not in the job's `if`: `jobs.<job_id>.if`
        # cannot read the matrix context (only github, needs, vars, inputs), so
        # GitHub rejected the whole file. `strategy` can read github and inputs.
        # Source: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
        # Source: https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#case
        os: ${{ fromJSON(case(
          inputs.macos == 'every' ||
          (inputs.macos == 'labelled' && contains(github.event.pull_request.labels.*.name, 'omnisnap:safari')),
          '["ubuntu-latest", "windows-latest", "macos-latest"]',
          '["ubuntu-latest", "windows-latest"]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The composite action lives in the Omnisnap repository, but a plain
      # checkout in a reusable workflow brings the *caller's* repository into
      # the workspace, where there is no action/ directory. Check the action
      # out beside it, at the ref the caller pinned the workflow to.
      # Source: https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
      # That checkout is the whole repository, and the action is its action/
      # folder (the root has no action.yml), so the path names both.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: omnisnap-action
      - uses: ./omnisnap-action/action
        with:
          version: ${{ inputs.version }}
          pages: ${{ inputs.pages }}
          engines: ${{ inputs.engines }}
          baseline: ${{ inputs.baseline }}
          runs: ${{ inputs.runs }}
          start: ${{ inputs.start }}
          wait-on: ${{ inputs.wait-on }}
          out: omnisnap-${{ matrix.os }}
          artifact-name: omnisnap-${{ matrix.os }}
          setup-timeout: ${{ inputs.setup-timeout }}
      - name: Retention
        if: always()
        shell: bash
        run: echo "artifact retention ${{ inputs.artifact-retention-days }} days (set in the repository settings)"

  merge:
    name: merge and comment
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          pattern: omnisnap-*
          path: bundles
      - name: Get the binary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/GerMP21/Omnisnap/releases/download/${VERSION}"
          name="omnisnap_${VERSION}_linux_amd64"
          # Download under the asset's own name: SHA256SUMS lists it by that
          # name, and --ignore-missing skips any other, so a file saved as
          # `omnisnap` is never checked and sha256sum fails with "no file was
          # verified". Rename it only once it has been verified.
          curl -fsSL -o "$name" "$base/$name"
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          sha256sum -c --ignore-missing SHA256SUMS
          mv "$name" omnisnap
          chmod +x omnisnap
      - name: Merge
        shell: bash
        run: |
          set -euo pipefail
          # Each artifact holds one bundle, at a depth that depends on the
          # download: one matching artifact is extracted straight into bundles/,
          # several each get their own bundles/<name>/ directory; and the
          # bundle keeps its omnisnap-out/ folder. So search without a depth.
          # Source: https://github.com/actions/download-artifact#inputs (merge-multiple)
          mapfile -t dirs < <(find bundles -name summary.json -printf '%h\n' | sort)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::warning::no bundle was produced"
            exit 0
          fi
          ./omnisnap merge "${dirs[@]}" --rename-hosts -o merged
      - name: Render the comment
        if: hashFiles('merged/summary.json') != ''
        shell: bash
        run: |
          ./omnisnap comment merged \
            --report-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > merged/comment.md
      - name: Upload the merged report
        uses: actions/upload-artifact@v7
        with:
          name: omnisnap-merged
          path: merged
          if-no-files-found: warn
      # Forks get a read-only token: their comment comes from the
      # workflow_run follow-up (action/fork-comment.yml), never from here.
      - name: Post or update the one comment
        if: |
          hashFiles('merged/summary.json') != '' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('merged/comment.md', 'utf8');
            const marker = '<!-- omnisnap-report -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const list = await github.rest.issues.listComments({owner, repo, issue_number, per_page: 100});
            const existing = list.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
