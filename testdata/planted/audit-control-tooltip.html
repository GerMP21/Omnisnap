<!doctype html>
<html><head><meta charset="utf-8"><title>audit control: tooltip</title>
<style>html,body{margin:0;font:16px/1.5 sans-serif}
#parent{position:relative;width:200px;height:40px;margin:40px;background:#eee}
#tip{position:absolute;left:150px;top:30px;width:160px;height:40px;background:#333;color:#fff}

<body><div id="parent">Hover<a id="partial" href="#p">partly offscreen</a><div id="tip">A tooltip</div></div></body></html>
