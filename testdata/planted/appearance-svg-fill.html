<!doctype html>
<html><head><meta charset="utf-8"><title>appearance: SVG fill</title>
<style>
html,body{margin:0;font:16px/1.5 sans-serif}
#target{display:block;margin:20px}
@supports (-moz-appearance: none) {
  #target rect { fill: #f5c518; }
}
</style></head>
<body><svg id="target" width="160" height="100" role="img" aria-label="a filled box"><rect width="160" height="100" fill="#3366cc"></rect></svg></body></html>
