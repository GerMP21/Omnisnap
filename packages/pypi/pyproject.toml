[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisnap"
version = "0.1.0rc7"
description = "Cross-engine layout differences from one command; see exactly which elements render differently in every browser you have installed"
readme = "README.md"
requires-python = ">=3.10"
# An SPDX expression (the table form is deprecated):
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license
license = "AGPL-3.0-or-later"
# The license text ships in every wheel (a copy of the repository's
# LICENSE.txt; test_api.py checks they stay identical).
license-files = ["LICENSE.txt"]
dependencies = []

# Shown in the PyPI sidebar; the labels are well-known ones:
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/
[project.urls]
Homepage = "https://omnisnap.org"
Repository = "https://github.com/GerMP21/Omnisnap"
Issues = "https://github.com/GerMP21/Omnisnap/issues"
Documentation = "https://omnisnap.org/docs/"

[project.scripts]
omnisnap = "omnisnap._cli:main"

[tool.setuptools]
# bin/ is package data, not a package: it exists only after staging
# (tools/release --stage, gitignored), and a listed package that is missing
# fails the build ("package directory 'omnisnap/bin' does not exist", CI run
# 44676567314). Setuptools warns that omnisnap.bin is not listed; that
# warning is expected.
packages = ["omnisnap"]

[tool.setuptools.package-data]
omnisnap = ["bin/*/omnisnap", "bin/*/omnisnap.exe"]

[tool.pytest.ini_options]
testpaths = ["omnisnap/test"]
