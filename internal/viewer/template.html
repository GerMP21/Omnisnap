<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Omnisnap report</title>
<style>{{style}}</style>
</head>
<body>
<header class="top"><h1>Omnisnap report</h1><p id="meta" class="muted"></p><button id="theme" type="button" aria-label="Toggle theme">◐</button></header>

<div id="results"></div>
</main>
<script type="application/json" id="data">{{data}}</script>
<script>{{app}}</script>
</body>
</html>
